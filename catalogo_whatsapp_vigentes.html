<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo WhatsApp Business — Ush By Ushuaia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ush-pink: #d88193;
      --ush-pink-hover: #c46d80;
      --ush-dark: #121826;
      --ush-card: #ffffff;
      --ush-border: #e2e8f0;
      --ush-bg: #f8fafc;
      --ush-text: #0f172a;
      --ush-muted: #64748b;
      --wa-green: #25d366;
      --wa-dark: #128c7e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
      background-color: var(--ush-bg);
      color: var(--ush-text);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    header {
      background: linear-gradient(135deg, #1b2333 0%, #0f172a 100%);
      color: white;
      padding: 32px 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .badge-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(216, 129, 147, 0.2);
      border: 1px solid var(--ush-pink);
      color: #fbcfe8;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 4px;
    }

    .progress-box {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px 20px;
      min-width: 280px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 10px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--wa-green), #4ade80);
      border-radius: 999px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .container {
      max-width: 1400px;
      margin: 32px auto 0;
      padding: 0 24px;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 9999px;
      border: 1px solid var(--ush-border);
      background: white;
      color: var(--ush-text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      border-color: var(--ush-pink);
      color: var(--ush-pink);
    }

    .tab-btn.active {
      background: var(--ush-pink);
      color: white;
      border-color: var(--ush-pink);
      box-shadow: 0 4px 14px rgba(216, 129, 147, 0.4);
    }

    .search-input {
      padding: 10px 16px 10px 38px;
      border-radius: 9999px;
      border: 1px solid var(--ush-border);
      font-family: inherit;
      font-size: 14px;
      min-width: 260px;
      background: white url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>') no-repeat 12px center;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--ush-pink);
      box-shadow: 0 0 0 3px rgba(216, 129, 147, 0.2);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: white;
      border: 1px solid var(--ush-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
      border-color: #cbd5e1;
    }

    .product-card.completed {
      background: #f0fdf4;
      border-color: #bbf7d0;
      opacity: 0.85;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--ush-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
    }

    .ref-badge {
      font-size: 15px;
      font-weight: 800;
      color: var(--ush-text);
      letter-spacing: 0.5px;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .check-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--wa-green);
      cursor: pointer;
    }

    .card-body {
      padding: 20px;
      display: flex;
      gap: 18px;
      flex: 1;
    }

    .img-wrapper {
      width: 120px;
      height: 160px;
      border-radius: 12px;
      overflow: hidden;
      background: #f1f5f9;
      position: relative;
      flex-shrink: 0;
      border: 1px solid var(--ush-border);
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .img-btn {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      color: white;
      border: none;
      font-size: 10px;
      font-weight: 700;
      padding: 5px;
      border-radius: 6px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      display: block;
      transition: background 0.2s ease;
    }

    .img-btn:hover {
      background: var(--ush-pink);
    }

    .info-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .prod-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--ush-text);
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .prod-meta {
      font-size: 12px;
      color: var(--ush-muted);
      margin-bottom: 12px;
    }

    .prices-box {
      background: #f8fafc;
      border: 1px solid var(--ush-border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .price-row:last-child {
      margin-bottom: 0;
    }

    .retail-strikethrough {
      text-decoration: line-through;
      color: #94a3b8;
      font-weight: 600;
    }

    .wholesale-highlight {
      color: var(--wa-dark);
      font-size: 16px;
      font-weight: 800;
    }

    .quick-copy-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-copy {
      padding: 7px 10px;
      background: white;
      border: 1px solid var(--ush-border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--ush-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-copy:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .btn-copy.success {
      background: var(--wa-green);
      color: white;
      border-color: var(--wa-green);
    }

    .btn-copy-full {
      grid-column: span 2;
      background: #fdf2f8;
      border-color: #fbcfe8;
      color: #be185d;
      font-weight: 700;
      padding: 9px;
    }

    .btn-copy-full:hover {
      background: var(--ush-pink);
      color: white;
      border-color: var(--ush-pink);
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 640px) {
      .card-grid { grid-template-columns: 1fr; }
      .header-content { flex-direction: column; align-items: stretch; }
      .search-input { width: 100%; }
    }
  </style>
</head>

    let activeCategory = 'PENDIENTES';
    let searchQuery = '';

    // Cargar estado de checklist desde localStorage
    const savedState = JSON.parse(localStorage.getItem('ush_wa_catalog_checked') || '{}');

    // Los 14 shorts vienen pre-marcados porque el usuario ya los montó
    PRODUCTS.filter(p => p.category === 'Shorts').forEach(p => {
      if (savedState[p.reference] === undefined) {
        savedState[p.reference] = true;
      }
    });

    function saveState() {
      localStorage.setItem('ush_wa_catalog_checked', JSON.stringify(savedState));
      updateProgress();
    }

    function toggleCheck(ref) {
      savedState[ref] = !savedState[ref];
      saveState();
      renderGrid();
    }

    function copyText(text, btn, label = '¡Copiado!') {
      navigator.clipboard.writeText(text).then(() => {
        showToast(label);
        if (btn) {
          const original = btn.innerHTML;
          btn.classList.add('success');
          btn.innerHTML = '✓ Copiado';
          setTimeout(() => {
            btn.classList.remove('success');
            btn.innerHTML = original;
          }, 1200);
        }
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function updateProgress() {
      // Contar sobre las 76 no-shorts
      const targetRefs = PRODUCTS.filter(p => p.category !== 'Shorts');
      const doneCount = targetRefs.filter(p => savedState[p.reference]).length;
      const pct = Math.round((doneCount / targetRefs.length) * 100);

      document.getElementById('progress-text').innerText = doneCount + ' / ' + targetRefs.length + ' (' + pct + '%)';
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('count-pending').innerText = targetRefs.length - doneCount;
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderGrid();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search').value.toLowerCase().trim();
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      let list = PRODUCTS.filter(p => {
        // Filtro categoría
        if (activeCategory === 'PENDIENTES') {
          if (p.category === 'Shorts') return false;
          if (savedState[p.reference]) return false; // Solo los que no se han marcado
        } else if (activeCategory !== 'ALL' && p.category !== activeCategory) {
          return false;
        }

        // Filtro búsqueda
        if (searchQuery) {
          const matchRef = p.reference.toLowerCase().includes(searchQuery);
          const matchName = p.name.toLowerCase().includes(searchQuery);
          const matchFit = (p.fit || '').toLowerCase().includes(searchQuery);
          if (!matchRef && !matchName && !matchFit) return false;
        }

        return true;
      });

      if (list.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 60px; color:#64748b;"><h3>🎉 ¡No hay prendas pendientes en esta sección!</h3><p>Has montado todas las referencias de este filtro.</p></div>';
        return;
      }

      list.forEach(p => {
        const isDone = !!savedState[p.reference];
        const card = document.createElement('div');
        card.className = 'product-card' + (isDone ? ' completed' : '');

        const safeDesc = p.whatsapp_description.replace(/\/g, '\\').replace(/'/g, "\'").replace(/\n/g, '\n');
        const safeName = p.name.replace(/'/g, "\'");

        card.innerHTML = `
          <div class="card-header">
            <span class="ref-badge">REF: ${p.reference}</span>
            <label class="check-label">
              <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleCheck('${p.reference}')">
              <span>${isDone ? '✅ Ya en WhatsApp' : 'Pendiente'}</span>
            </label>
          </div>

          <div class="card-body">
            <div class="img-wrapper">
              <img src="${p.main_image}" alt="${p.reference}" loading="lazy">
              <a href="${p.main_image}" target="_blank" class="img-btn">Ver Foto HD ↗</a>
            </div>

            <div class="info-col">
              <div>
                <h3 class="prod-name">${p.name}</h3>
                <div class="prod-meta">
                  <span>${p.category}</span> ${p.fit ? '• Silueta: ' + p.fit : ''} • Tallas: ${p.tallas}
                </div>

                <div class="prices-box">
                  <div class="price-row">
                    <span>Precio Detal (Tachado):</span>
                    <span class="retail-strikethrough">${p.price_retail_fmt}</span>
                  </div>
                  <div class="price-row">
                    <span>Precio Mayorista (Oferta):</span>
                    <span class="wholesale-highlight">${p.price_wholesale_fmt}</span>
                  </div>
                </div>
              </div>

              <div class="quick-copy-grid">
                <button class="btn-copy" onclick="copyText('${safeName}', this, 'Nombre copiado')">
                  📋 Nombre
                </button>
                <button class="btn-copy" onclick="copyText('${p.price_wholesale}', this, 'Precio copiado')">
                  💲 Mayorista (${p.price_wholesale})
                </button>
                <button class="btn-copy" onclick="copyText('${p.price_retail}', this, 'Precio detal copiado')">
                  🏷️ Detal (${p.price_retail})
                </button>
                <button class="btn-copy" onclick="copyText('${p.web_url}', this, 'Enlace copiado')">
                  🔗 Enlace Web
                </button>
                <button class="btn-copy btn-copy-full" onclick="copyText('${safeDesc}', this, 'Ficha completa copiada')">
                  💬 Copiar Descripción Completa WhatsApp
                </button>
              </div>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Inicializar
    updateProgress();
    renderGrid();
  </script>
